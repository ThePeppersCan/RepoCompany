name: Counterpull native dependencies
on:
  push:
    branches: [counterpull-development-20261029]
    paths: [.github/workflows/counterpull-native-check.yml]
permissions:
  contents: read
jobs:
  native-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch content-addressed baseline without altering production
        run: |
          python3 - <<'PY'
          import urllib.request,pathlib,hashlib,json,concurrent.futures,time
          base='https://counterpull-development.kkcolf.workers.dev'
          def read(url):
              for i in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 CounterpullDevelopmentSnapshot/1.0'})
                      return urllib.request.urlopen(req,timeout=45).read()
                  except Exception:
                      if i==2: raise
                      time.sleep(2)
          manifest=json.loads(read(base+'/snapshot.json'))
          out=pathlib.Path('native');out.mkdir()
          def get(item):
              path,meta=item
              if path.startswith('/cdn-cgi/'): return
              data=read(base+path)
              assert hashlib.sha256(data).hexdigest()==meta['sha256'],path
              p=out/path.lstrip('/');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              list(pool.map(get,manifest['files'].items()))
          (out/'SOURCE-MANIFEST.json').write_text(json.dumps(manifest,indent=2))
          print('Verified complete native baseline. No production deployment performed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: counterpull-native-2.27.1
          path: native
          retention-days: 7
