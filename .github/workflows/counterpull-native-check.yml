name: Counterpull native dependencies
on:
  push:
    branches: [counterpull-development-20261029]
    paths: [.github/workflows/counterpull-native-check.yml]
permissions:
  contents: read
jobs:
  native-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and verify deployed native controller and renderer
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib, hashlib, json
          out=pathlib.Path('native');out.mkdir()
          files={
          'movement.js':'5937c54127cc1ebda6c3885859d65dff248ec6cf8570994b5b7ad48d9a836d8c',
          'traversal.js':'79b7649416211cf208e3159cb2085e3b724edebefca04aed62c7aa8f069fa545',
          'track-path.js':'1a212f21d4df9421b24c78e467251d054e29ed77695de6e2faf3ef6d2a67c38a',
          'vendor/three.module.js':'ce1fa418de16a19495a9f72495580e3015d7745c296d3ce0485897f902ddedfb',
          'main.js':'af05d3942bef7838809abfe1ce12adf0e0bdbbe9b80517d1831b79a13ac57b31',
          'stage.js':'872e6ddcd60e22ccbe913f5e04dbdcf4fb67754dd2de3bdc6e92dac4979a8bf5',
          'journeys.js':'9edccee4f0ab8ff6ee676c867ea27a21ac3e7f38467b2119b897c75a00164709',
          'index.html':'51b716f4636b5c9b853b93c9741885ad2c42dcb776402a3e3017b230feff7756',
          'unravel-world.js':'f4af2501b93cc920626780d188df5cfa3a0209d9083bbf888166a1aede702ebc',
          'unravel.js':'a82d3cd2b9ef875ad4cac40f2485ed8a70bcb89e0dfcb57d958ada86749c7d60'
          }
          for name,sha in files.items():
              data=urllib.request.urlopen('https://repo-company-games.pages.dev/blobs/'+sha+'.bin',timeout=40).read()
              assert hashlib.sha256(data).hexdigest()==sha,name+' hash mismatch'
              p=out/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          (out/'SOURCE-SHA256.json').write_text(json.dumps(files,indent=2))
          print('Verified',len(files),'COMP-RUN 2.27.1 files. No deployment performed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: counterpull-native-2.27.1
          path: native
          retention-days: 7
