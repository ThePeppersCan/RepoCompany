<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Repo Company</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-locked="true">
  <header class="titlebar">
    <div class="titlebar-brand">
      <svg class="repo-mark" viewBox="565 234 335 341" aria-hidden="true"><image href="assets/repo-brand.png" width="1440" height="900"/></svg>
      <span>REPO COMPANY</span>
    </div>
    <div id="game-toolbar" class="game-toolbar" hidden>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <span id="game-title" class="game-title" aria-live="polite"></span>
      <button id="back-to-game" class="toolbar-button" hidden>Back to game</button>
      <button id="game-messages" class="toolbar-button" aria-label="Open messages"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h12v9H9l-5 3V4Z"/></svg><span id="game-messages-label">Messages</span><span id="message-count" class="message-count" hidden></span></button>
      <button id="game-fullscreen" class="toolbar-button icon-button" data-window="fullscreen" aria-label="Enter fullscreen"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4H4v3m9-3h3v3M4 13v3h3m9-3v3h-3"/></svg></button>
      <button id="exit-game" class="toolbar-button exit-game">Exit game</button>
    </div>
    <div id="download-status" class="download-status" role="status" aria-live="polite" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-3-3 3 3 3-3M4 13v4h12v-4"/></svg>
      <span id="download-label"></span>
    </div>
    <div class="window-controls" aria-label="Window controls">
      <button data-window="minimize" aria-label="Minimize"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg></button>
      <button data-window="maximize" aria-label="Maximize or restore"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10"/></svg></button>
      <button data-window="close" class="close-window" aria-label="Close"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M5 15 15 5"/></svg></button>
    </div>
  </header>
  <p id="shell-notice" class="shell-notice" role="alert" hidden></p>
  <!-- The native website view occupies this entire space once connected. -->
  <main class="website-fallback" aria-labelledby="connection-title" data-phase="loading">
    <div class="entry-atmosphere" aria-hidden="true"></div>
    <div class="connection-card">
      <div class="brand-loader" aria-hidden="true">
        <img class="brand-loader-piece piece-top" src="assets/repo-company-mark.png" alt="" draggable="false">
        <img class="brand-loader-piece piece-middle" src="assets/repo-company-mark.png" alt="" draggable="false">
        <img class="brand-loader-piece piece-bottom" src="assets/repo-company-mark.png" alt="" draggable="false">
      </div>
      <h1 id="connection-title">Opening Repo Company</h1>
      <p id="connection-message" role="status">Connecting to your collection.</p>
      <form id="sign-in-form" class="sign-in-form" hidden>
        <label for="sign-in-username">Username</label>
        <input id="sign-in-username" name="username" autocomplete="username" minlength="3" maxlength="16" pattern="[A-Za-z0-9_-]{3,16}" required spellcheck="false" autocapitalize="none">
        <label for="sign-in-password">Password</label>
        <div class="password-field"><input id="sign-in-password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="1024" required><button id="password-visibility" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>
        <p id="sign-in-error" role="alert" hidden></p>
        <button id="sign-in-submit" class="primary-button" type="submit">Log in</button>
        <button id="sign-in-mode" class="sign-in-switch" type="button">Create account</button>
      </form>
      <div id="connection-actions" class="connection-actions" hidden>
        <button id="reconnect" class="primary-button">Reconnect</button>
        <button id="open-website" class="secondary-button">Open website</button>
      </div>
      <p id="connection-note" class="connection-note" hidden>Your installed games and account data are kept.</p>
    </div>
  </main>
</body>
</html>
