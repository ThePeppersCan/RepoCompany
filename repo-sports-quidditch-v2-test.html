/* Production broadcast: permanently suppress known legacy test-warning hosts. */
html::before,html::after,body::before,body::after{content:none!important;display:none!important}
.repo-sports-v2-test-warning,.wcg-v2-test-warning,[data-v2-test-warning],[data-leaderboard-writes-warning],[class*="test-warning"],[class*="leaderboard-write"]{display:none!important;visibility:hidden!important}
</style><script>
(()=>{
  const warningText='REPO SPORTS V2 TEST · LEADERBOARD WRITES DISABLED';
  const cleanNode=node=>{
    if(!node||node.nodeType!==1)return;
    const el=node;
    const text=String(el.textContent||'').replace(/\s+/g,' ').trim().toUpperCase();
    if(text===warningText||((text.length<160)&&text.includes('REPO SPORTS V2 TEST')&&text.includes('LEADERBOARD WRITES DISABLED'))){el.remove();return;}
    // Inspect only newly-added descendants. Previous builds rescanned *every* DOM
    // node and forced pseudo-element styles every 1.5s, causing periodic frame hitches.
    for(const child of el.querySelectorAll?.('.repo-sports-v2-test-warning,.wcg-v2-test-warning,[data-v2-test-warning],[data-leaderboard-writes-warning],[class*="test-warning"],[class*="leaderboard-write"]')||[])child.remove();
  };
  const start=()=>{
    for(const el of document.querySelectorAll('.repo-sports-v2-test-warning,.wcg-v2-test-warning,[data-v2-test-warning],[data-leaderboard-writes-warning],[class*="test-warning"],[class*="leaderboard-write"]'))el.remove();
    new MutationObserver(records=>{for(const record of records)for(const node of record.addedNodes||[])cleanNode(node)}).observe(document.documentElement,{childList:true,subtree:true});
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script><script>window.toaState={adminMode:false}</script><script src="repo-sports-quidditch-v2.js?v=repo-sports-shootout-recovery-20260818"></script><script>
(()=>{
  const A=['arena-01','arena-02','arena-03','arena-04','arena-05','arena-06','arena-07','arena-08','arena-09','arena-10','arena-11','arena-12'];
  const T=['Hrafnvik','Blackglass','Saint Ciro','Marenza','Grand Khor','Aurelia','Drazh Hollow','Rova End','Zafir Row','Talun Cross','Ossa Mere','Varka Fell','Iskara','Naskor','Ashwick','Skarholt','Orsanne','Cinderbank'];
  const P={attacker:['besquelcher','pipsqueak'],defender:['jenny','rocky'],support:['nimbler2000','soup']};
  const HEADLESS=new URLSearchParams(location.search).get('headless')==='1';
  let activeSerial=0,lastMeta=null,opening=false,forceFreshResync=false;window.REPO_SPORTS_V2_SYNC_BUILD='repo-sports-shootout-recovery-20260818';

  if(HEADLESS){document.documentElement.dataset.repoV2Headless='true';document.body.style.visibility='hidden'}

  function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function hashSerial(serial){let x=(Number(serial)||1)>>>0;x^=0x51f15e;x=Math.imul(x^(x>>>16),0x45d9f3b);x=Math.imul(x^(x>>>16),0x45d9f3b);return (x^(x>>>16))>>>0}
  // Club-selection migration: keep every already-issued serial through 34 on
  // the legacy deterministic draw so deploying this build cannot alter the
  // current live fixture. From serial 35 onward, the draw actively balances MP.
  const BALANCED_SCHEDULE_START=35;
  // Official standings snapshot carried forward through the current ORSANNE v
  // OSSA MERE fixture. It is used only as a deterministic migration baseline;
  // results/win rates remain entirely controlled by the match engine/server.
  const BALANCED_BASE_MP=Object.freeze({
    'Hrafnvik':2,'Blackglass':9,'Saint Ciro':1,'Marenza':4,'Grand Khor':2,'Aurelia':2,
    'Drazh Hollow':1,'Rova End':4,'Zafir Row':3,'Talun Cross':2,'Ossa Mere':4,'Varka Fell':5,
    'Iskara':2,'Naskor':1,'Ashwick':3,'Skarholt':3,'Orsanne':3,'Cinderbank':3
  });
  function legacyFixtureForSerial(serial){
    const r=rng(hashSerial(serial));const pick=a=>a[Math.floor(r()*a.length)];
    const arena=pick(A);let home=pick(T),away=pick(T);while(away===home)away=pick(T);
    const homePlayers=[],awayPlayers=[];
    Object.values(P).forEach(pair=>{const first=r()<.5?0:1;homePlayers.push(pair[first]);awayPlayers.push(pair[1-first])});
    return{arena,home,away,homePlayers,awayPlayers,matchKey:`v2-live-${serial}`};
  }
  function balancedClubPairForSerial(serial){
    const counts={};T.forEach(team=>counts[team]=Math.max(0,Number(BALANCED_BASE_MP[team])||0));
    const pairCounts=new Map();let previous=[];let chosen=null;
    const pairKey=(a,b)=>[a,b].sort().join('|');
    for(let s=BALANCED_SCHEDULE_START;s<=serial;s++){
      const r=rng((hashSerial(s)^0x6b616c61)>>>0),jitter=new Map(T.map(team=>[team,r()]));
      const ordered=T.slice().sort((a,b)=>
        counts[a]-counts[b] ||
        (previous.includes(a)?1:0)-(previous.includes(b)?1:0) ||
        (jitter.get(a)-jitter.get(b)) || a.localeCompare(b)
      );
      const first=ordered[0];
      const second=ordered.slice(1).sort((a,b)=>
        counts[a]-counts[b] ||
        (previous.includes(a)?1:0)-(previous.includes(b)?1:0) ||
        ((pairCounts.get(pairKey(first,a))||0)-(pairCounts.get(pairKey(first,b))||0)) ||
        (jitter.get(a)-jitter.get(b)) || a.localeCompare(b)
      )[0];
      const key=pairKey(first,second);pairCounts.set(key,(pairCounts.get(key)||0)+1);
      counts[first]++;counts[second]++;previous=[first,second];
      const flip=r()<.5;chosen={home:flip?second:first,away:flip?first:second};
    }
    return chosen;
  }
  function fixtureForSerial(serial){
    const legacy=legacyFixtureForSerial(serial);
    if(Number(serial)<BALANCED_SCHEDULE_START)return legacy;
    const pair=balancedClubPairForSerial(Number(serial));
    return pair?{...legacy,home:pair.home,away:pair.away}:legacy;
  }

  async function applyLiveMeta(meta){
    if(!meta||!Number(meta.match_serial))return;
    lastMeta=meta;
    const serial=Number(meta.match_serial);
    const transport=Math.max(0,Math.min(250,Number(meta.transport_comp_ms)||0))/1000;
    const target=Math.max(0,(Number(meta.active_elapsed_ms)||0)/1000+transport-.12);
    const status=RepoSportsQuidditchV2.getStatus?.()||null;
    const drift=status?.open&&status.liveSerial===serial
      ?Number(status.engineElapsed||0)-target
      :0;

    // STABLE SYNC RULE: NEVER rebuild/reopen the same match serial for clock drift.
    // Reopening was causing visible freezes, leaderboard resets, score replays and
    // apparent clock rewinds whenever a normal network sample briefly crossed the
    // drift threshold. The engine now corrects drift in-place: if behind it catches
    // up deterministically; if ahead it simply waits for the authoritative clock.
    // A full close/open is allowed only when the server actually advances serial.
    const needsOpen=serial!==activeSerial;

    if(needsOpen){
      if(opening)return;
      opening=true;
      try{
        if(activeSerial||status?.open)await RepoSportsQuidditchV2.close(false);
        activeSerial=0;
        const m=fixtureForSerial(serial);
        const opened=await RepoSportsQuidditchV2.open({
          fixtureId:m.arena,homeName:m.home,awayName:m.away,
          homePlayers:m.homePlayers,awayPlayers:m.awayPlayers,
          matchKey:m.matchKey,liveSerial:serial,syncMode:true,headless:HEADLESS,
          targetElapsedMs:Math.max(0,target*1000),
          running:meta.running!==false,
          stage:'REPO SPORTS · LIVE ROTATION'
        });
        activeSerial=opened?serial:0;
      }finally{opening=false}
    }

    RepoSportsQuidditchV2.syncLive?.(meta);
  }

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){forceFreshResync=true;return;}
    forceFreshResync=true;
    setTimeout(()=>{try{parent.postMessage({type:'repo-sports-v2-live-state-request',headless:HEADLESS,reason:'visibility-resume',fresh:true},'*')}catch(_){}},0);
  });

  addEventListener('message',event=>{
    const d=event?.data;if(!d||d.type!=='repo-sports-v2-live-state')return;
    void applyLiveMeta(d.payload||{});
  });
  addEventListener('load',()=>{
    setTimeout(()=>{try{parent.postMessage({type:'repo-sports-v2-live-state-request',headless:HEADLESS},'*')}catch(_){}},40);
  });
  window.RepoSportsV2CycleNext=()=>{};
})();
</script></body></html>
