<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="repo-sports-quidditch-v2.css?v=test31-fulltime-kat"></head><body style="margin:0;background:#02070c;overflow:hidden"><script>window.toaState={adminMode:true}</script><script src="repo-sports-quidditch-v2.js?v=test30-goal-presentation"></script><script>
(()=>{const A=['arena-01','arena-02','arena-03','arena-04','arena-05','arena-06','arena-07','arena-08','arena-09','arena-10','arena-11','arena-12'],T=['Appleby Arrows','Ballycastle Bats','Caerphilly Catapults','Chudley Cannons','Falmouth Falcons','Holyhead Harpies','Kenmare Kestrels','Montrose Magpies','Pride of Portree','Puddlemere United','Tutshill Tornados','Wigtown Wanderers','Wimbourne Wasps','Vratsa Vultures','Sweetwater All-Stars','Toyohashi Tengu','Gryffindor','Hufflepuff','Ravenclaw','Slytherin','Gimbi Giant-Slayers','Patonga Proudsticks','Sumbawanga Sunrays','Tchamba Charmers','Fitchburg Finches','Haileybury Hammers','Moose Jaw Meteorites','Stonewall Stormers','Tarapoto Tree-Skimmers','Barnton','Bigonville Bombers','Braga Broomfleet','Cork','Gorodok Gargoyles','Grodzisk Goblins','Heidelberg Harriers','Ilkley','Karasjok Kites','Lancashire','Quiberon Quafflepunchers','Yorkshire','Moutohora Macaws','Thundelarra Thunderers','Wollongong Warriors'],P={attacker:['besquelcher','pipsqueak'],defender:['jenny','rocky'],support:['nimbler2000','soup']},CYCLE=360000;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fixture(){const slot=Math.floor(Date.now()/CYCLE),stored=Number(sessionStorage.getItem('repoSportsV2Slot')||-1);if(stored!==slot){sessionStorage.setItem('repoSportsV2Slot',String(slot));sessionStorage.setItem('repoSportsV2ManualOffset','0')}const offset=Number(sessionStorage.getItem('repoSportsV2ManualOffset')||0),r=rng((slot+offset*104729)^0x51f15e);const pick=a=>a[Math.floor(r()*a.length)],arena=pick(A);let home=pick(T),away=pick(T);while(away===home)away=pick(T);const h=[],w=[];Object.values(P).forEach(pair=>{const f=r()<.5?0:1;h.push(pair[f]);w.push(pair[1-f])});return{arena,home,away,homePlayers:h,awayPlayers:w,matchKey:`v2-rotation-${slot}-${offset}`}}
async function go(){const m=fixture();await RepoSportsQuidditchV2.open({fixtureId:m.arena,homeName:m.home,awayName:m.away,homePlayers:m.homePlayers,awayPlayers:m.awayPlayers,matchKey:m.matchKey,startedAt:Date.now(),stage:'REPO SPORTS · STANDARD ROTATION TEST'})}
window.RepoSportsV2CycleNext=()=>{sessionStorage.setItem('repoSportsV2ManualOffset',String(Number(sessionStorage.getItem('repoSportsV2ManualOffset')||0)+1));setTimeout(()=>location.reload(),220)};
addEventListener('load',()=>setTimeout(go,80))})();
</script></body></html>
