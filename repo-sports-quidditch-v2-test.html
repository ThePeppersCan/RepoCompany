<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="repo-sports-quidditch-v2.css?v=repo-sports-spatial-neutrality-20260812-0215"></head><body style="margin:0;background:#02070c;overflow:hidden"><script>window.toaState={adminMode:false}</script><script src="repo-sports-quidditch-v2.js?v=repo-sports-spatial-neutrality-20260812-0215"></script><script>
(()=>{
  const A=['arena-01','arena-02','arena-03','arena-04','arena-05','arena-06','arena-07','arena-08','arena-09','arena-10','arena-11','arena-12'];
  const T=['Hrafnvik','Blackglass','Saint Ciro','Marenza','Grand Khor','Aurelia','Drazh Hollow','Rova End','Zafir Row','Talun Cross','Ossa Mere','Varka Fell','Iskara','Naskor','Ashwick','Skarholt','Orsanne','Cinderbank'];
  const P={attacker:['besquelcher','pipsqueak'],defender:['jenny','rocky'],support:['nimbler2000','soup']};
  const HEADLESS=new URLSearchParams(location.search).get('headless')==='1';
  let activeSerial=0,lastMeta=null,opening=false,forceFreshResync=false;window.REPO_SPORTS_V2_SYNC_BUILD='repo-sports-spatial-neutrality-20260812-0215';

  if(HEADLESS){document.documentElement.dataset.repoV2Headless='true';document.body.style.visibility='hidden'}

  function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function hashSerial(serial){let x=(Number(serial)||1)>>>0;x^=0x51f15e;x=Math.imul(x^(x>>>16),0x45d9f3b);x=Math.imul(x^(x>>>16),0x45d9f3b);return (x^(x>>>16))>>>0}
  function fixtureForSerial(serial){
    const r=rng(hashSerial(serial));const pick=a=>a[Math.floor(r()*a.length)];
    const arena=pick(A);let home=pick(T),away=pick(T);while(away===home)away=pick(T);
    const homePlayers=[],awayPlayers=[];
    Object.values(P).forEach(pair=>{const first=r()<.5?0:1;homePlayers.push(pair[first]);awayPlayers.push(pair[1-first])});
    return{arena,home,away,homePlayers,awayPlayers,matchKey:`v2-live-${serial}`};
  }

  async function applyLiveMeta(meta){
    if(!meta||!Number(meta.match_serial))return;
    lastMeta=meta;
    const serial=Number(meta.match_serial);
    const transport=Math.max(0,Math.min(250,Number(meta.transport_comp_ms)||0))/1000;
    const target=Math.max(0,(Number(meta.active_elapsed_ms)||0)/1000+transport-.12);
    const status=RepoSportsQuidditchV2.getStatus?.()||null;
    const drift=status?.open&&status.liveSerial===serial
      ?Number(status.engineElapsed||0)-target
      :0;

    // STABLE SYNC RULE: NEVER rebuild/reopen the same match serial for clock drift.
    // Reopening was causing visible freezes, leaderboard resets, score replays and
    // apparent clock rewinds whenever a normal network sample briefly crossed the
    // drift threshold. The engine now corrects drift in-place: if behind it catches
    // up deterministically; if ahead it simply waits for the authoritative clock.
    // A full close/open is allowed only when the server actually advances serial.
    const needsOpen=serial!==activeSerial;

    if(needsOpen){
      if(opening)return;
      opening=true;
      try{
        if(activeSerial||status?.open)await RepoSportsQuidditchV2.close(false);
        activeSerial=0;
        const m=fixtureForSerial(serial);
        const opened=await RepoSportsQuidditchV2.open({
          fixtureId:m.arena,homeName:m.home,awayName:m.away,
          homePlayers:m.homePlayers,awayPlayers:m.awayPlayers,
          matchKey:m.matchKey,liveSerial:serial,syncMode:true,headless:HEADLESS,
          targetElapsedMs:Math.max(0,target*1000),
          running:meta.running!==false,
          stage:'REPO SPORTS · LIVE ROTATION'
        });
        activeSerial=opened?serial:0;
      }finally{opening=false}
    }

    RepoSportsQuidditchV2.syncLive?.(meta);
  }

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){forceFreshResync=true;return;}
    forceFreshResync=true;
    setTimeout(()=>{try{parent.postMessage({type:'repo-sports-v2-live-state-request',headless:HEADLESS,reason:'visibility-resume',fresh:true},'*')}catch(_){}},0);
  });

  addEventListener('message',event=>{
    const d=event?.data;if(!d||d.type!=='repo-sports-v2-live-state')return;
    void applyLiveMeta(d.payload||{});
  });
  addEventListener('load',()=>{
    setTimeout(()=>{try{parent.postMessage({type:'repo-sports-v2-live-state-request',headless:HEADLESS},'*')}catch(_){}},40);
  });
  window.RepoSportsV2CycleNext=()=>{};
})();
</script></body></html>
