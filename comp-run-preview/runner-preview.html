<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COMP-RUN runner preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b090b;color:#e6e4df;font:14px system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}main{position:relative;min-height:100dvh;display:flex;flex-direction:column;padding:20px;pointer-events:none}header,footer{pointer-events:auto}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0 auto 0 0;font-weight:500}select,button{font:inherit;color:inherit;background:#211a1c;border:1px solid #534044;border-radius:5px;padding:10px 14px;cursor:pointer}select:focus-visible,button:focus-visible{outline:2px solid #d34b47;outline-offset:3px}#stage{flex:1;min-height:230px;touch-action:none;pointer-events:auto;cursor:grab}footer{display:flex;gap:12px;flex-wrap:wrap;align-items:center}#inspect{background:#d34b47;color:#fff5e9;border-color:#d34b47}p{margin:8px 0;max-width:620px;line-height:1.5;color:#b6aaad}.label{font-size:11px;letter-spacing:2px}#status{min-width:160px;color:#d34b47}@media(max-width:520px){main{padding:12px}h1{width:100%;font-size:18px}select{max-width:48%}p{font-size:12px}#stage{min-height:190px}}
.embedded h1,.embedded #description{display:none}.embedded main{padding:16px}.embedded #stage{min-height:240px}.embedded header{justify-content:flex-end}.embedded #status{font-size:12px;min-width:0}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style></head><body><canvas id="canvas" aria-label="Interactive 3D runner"></canvas><main><header><h1 id="name">Runner preview</h1><select id="runner" aria-label="Runner"></select></header><div id="stage" role="group" tabindex="0" aria-label="Drag to rotate runner. Press F to inspect."></div><footer><button id="inspect">Inspect / flip · F</button><button id="still" aria-pressed="false">Still</button><button id="run" aria-pressed="true">Run with knife</button><select id="effects" aria-label="Runner effects"><option value="full">Full effects</option><option value="subtle">Subtle effects</option><option value="off">Effects off</option></select><span id="status" role="status"></span></footer><p id="description"></p></main><script type="module" src="./runner-preview.js?v=2.16.0"></script></body></html>
