name = "repocompany-comp-run-races"
main = "worker.mjs"
compatibility_date = "2026-10-13"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 0.1

[[durable_objects.bindings]]
name = "RACE_ROOMS"
class_name = "RaceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceRoom"]

[[ratelimits]]
name = "ROOM_LIMIT"
namespace_id = "26001"
simple = { limit = 30, period = 60 }
