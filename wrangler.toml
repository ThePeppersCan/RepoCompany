name = "repocompany"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-06"

[vars]
WIBSWORTH_AI_ENABLED = "false"

[env.preview.vars]
WIBSWORTH_AI_ENABLED = "false"

[env.production.vars]
WIBSWORTH_AI_ENABLED = "true"
WIBSWORTH_PROVIDER = "ks5b"

[[d1_databases]]
binding = "DASHBOARD_DB"
database_name = "repo-dashboard-staging"
database_id = "c6aa1b5b-07bc-45d5-863b-d98ab1c59132"
preview_database_id = "DASHBOARD_DB"

[[env.preview.d1_databases]]
binding = "DASHBOARD_DB"
database_name = "repo-dashboard-staging"
database_id = "c6aa1b5b-07bc-45d5-863b-d98ab1c59132"
preview_database_id = "DASHBOARD_DB"

[[env.production.d1_databases]]
binding = "DASHBOARD_DB"
database_name = "repo-dashboard-production"
database_id = "a88e0fb6-1782-440a-adfd-0661dcd0279f"

[[env.production.d1_databases]]
binding = "MOROGUE_DB"
database_name = "morogue-leaderboards"
database_id = "a72085d9-2324-40ad-8e18-004c01a14f5c"

[[env.production.services]]
binding = "REPO_VOICE"
service = "repocompany-voice"
